# Render Blueprint — New → Blueprint → pick this repo.
# A persistent disk keeps articles, images and the login across deploys
# (disks need a paid instance; "starter" is the smallest).
services:
  - type: web
    name: all-of-these-and-more
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false # Render asks you for it when you create the Blueprint
    disk:
      name: content
      mountPath: /var/data
      sizeGB: 1
