<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} — {{siteTitle}}</title>
  <meta name="description" content="{{description}}">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="{{cover}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#09090a">
  <link rel="alternate" type="application/rss+xml" title="{{siteTitle}}" href="/rss.xml">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/article.css">
  <style>:root { --accent: {{accent}}; }</style>
  <script>
    document.documentElement.classList.add('js');
    // arriving from a cube: let the view transition carry the cover + title instead of the entrance animation
    addEventListener('pagereveal', (e) => { if (e.viewTransition) document.documentElement.classList.add('vt'); });
  </script>
</head>
<body class="article-page">
  <div class="grain" aria-hidden="true"></div>
  <div class="progress" aria-hidden="true"><i id="progress"></i></div>

  <header class="topbar" id="topbar">
    <a class="wordmark back" href="/" aria-label="Back to {{siteTitle}}">
      <span class="back__arrow" aria-hidden="true">←</span>
      <svg class="wordmark__cube" viewBox="0 0 26 30" aria-hidden="true"><path d="M13 0 26 7.5 13 15 0 7.5Z" fill="#ece9e2"/><path d="M0 7.5 13 15v15L0 22.5Z" fill="#6d6b66"/><path d="M26 7.5 13 15v15l13-7.5Z" fill="#2a2a2d"/></svg>
      <span class="hide-xs">{{siteTitle}}</span>
    </a>
    <nav class="nav mono">
      <span class="nav__time hide-sm" id="timeLeft">{{minutes}} min read</span>
      <button class="kbd" data-open-palette type="button">Search <kbd>⌘K</kbd></button>
    </nav>
  </header>

  <article class="post">
    <header class="post__head">
      <p class="meta post__meta">
        <span class="post__no">№ {{number}}</span>
        <span>{{category}}</span>
        <time datetime="{{dateIso}}">{{dateHuman}}</time>
        <span>{{minutes}} min</span>
      </p>
      <h1 class="post__title" id="postTitle">{{title}}</h1>
      <p class="post__dek">{{dek}}</p>
      <p class="meta post__by">By {{author}}</p>
    </header>

    <figure class="post__cover" id="cover">
      <img src="{{cover}}" alt="{{coverAlt}}" fetchpriority="high">
    </figure>

    <div class="post__grid">
      <aside class="toc" aria-label="Contents">
        <p class="meta">Contents</p>
        {{{tocHtml}}}
      </aside>

      <div class="prose" id="prose">
        {{{bodyHtml}}}
      </div>

      <aside class="post__tools">
        <button class="tool mono" id="copyLink" type="button"><span>Copy link</span></button>
        <button class="tool mono" id="share" type="button" hidden><span>Share</span></button>
      </aside>
    </div>

    <footer class="post__foot">
      <div class="divider" aria-hidden="true"><i></i><i></i><i></i></div>
      <ul class="tags meta">{{{tagsHtml}}}</ul>
      <p class="post__end meta">Thanks for reading — {{author}}</p>
    </footer>
  </article>

  <nav class="more" aria-label="More articles">
    {{{nextHtml}}}
    <a class="more__all" href="/#index"><span class="meta">The whole catalog</span><span class="more__big">All of it →</span></a>
  </nav>

  <footer class="foot mono">
    <span>{{siteTitle}}</span>
    <span class="foot__links"><a href="/">Home</a><a href="/rss.xml">RSS</a></span>
  </footer>

  <div class="lightbox" id="lightbox" aria-hidden="true"><img alt=""><p class="meta"></p></div>

  <script src="/js/common.js"></script>
  <script src="/js/article.js"></script>
</body>
</html>
