<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor — All of These and More</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/article.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin">
  <!-- ============================== sign in -->
  <section class="login" id="login" hidden>
    <form class="login__box" id="loginForm">
      <svg class="login__cube" viewBox="0 0 26 30" aria-hidden="true"><path d="M13 0 26 7.5 13 15 0 7.5Z" fill="var(--accent)"/><path d="M0 7.5 13 15v15L0 22.5Z" fill="#6d6b66"/><path d="M26 7.5 13 15v15l13-7.5Z" fill="#2a2a2d"/></svg>
      <h1>The Editor</h1>
      <p class="meta">All of These and More</p>
      <label class="sr" for="pw">Password</label>
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
      <button class="btn btn--accent" type="submit">Enter</button>
      <p class="login__err" id="loginErr" role="alert"></p>
    </form>
  </section>

  <!-- ============================== app -->
  <div class="shell" id="app" hidden>
    <aside class="side">
      <a class="wordmark" href="#/articles">
        <svg class="wordmark__cube" viewBox="0 0 26 30" aria-hidden="true"><path d="M13 0 26 7.5 13 15 0 7.5Z" fill="var(--accent)"/><path d="M0 7.5 13 15v15L0 22.5Z" fill="#6d6b66"/><path d="M26 7.5 13 15v15l13-7.5Z" fill="#2a2a2d"/></svg>
        <span>Editor</span>
      </a>
      <nav class="side__nav">
        <a href="#/articles" data-nav="articles"><i>▤</i><span>Articles</span></a>
        <a href="#/new" data-nav="new"><i>+</i><span>New article</span></a>
        <a href="#/settings" data-nav="settings"><i>⚙</i><span>Settings</span></a>
      </nav>
      <div class="side__foot">
        <a href="/" target="_blank" rel="noopener"><i>↗</i><span>View site</span></a>
        <button type="button" id="logout"><i>⏻</i><span>Sign out</span></button>
      </div>
    </aside>
    <main class="main" id="view"></main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <input type="file" id="filePick" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" hidden>

  <script src="/admin/admin.js"></script>
</body>
</html>
